<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
    /* Dev-only: every board-member archetype variant and every chairman in all
       three expressions. Serve the repo root with `python -m http.server 8080`
       and open /tools/sprite-gallery.html. Query param: ?scale=<n> (default 3). */
    :root { --bg: #1a1a2e; --panel: #2d2d44; --edge: #5a5a7a; --text: #e8e8f0; --muted: #aaaacc; --gold: #ffcc00; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.3 'VT323', monospace; }
    header { padding: 16px; }
    h1 { font: 14px/1.4 'Press Start 2P', monospace; margin: 0; color: var(--gold); }
    main { padding: 0 16px 24px; display: grid; gap: 20px; }
    section h2 { font: 12px/1.4 'Press Start 2P', monospace; margin: 0 0 8px; }
    section h2 small { font: 16px 'VT323', monospace; color: var(--muted); margin-left: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    figure { margin: 0; background: var(--panel); border: 2px solid var(--edge); text-align: center; }
    canvas { display: block; image-rendering: pixelated; }
    figcaption { padding: 0 4px 2px; font-size: 14px; color: var(--muted); max-width: 120px; }
</style>
</head>
<body>
<header><h1>Sprite gallery</h1></header>
<main id="grid"></main>
<script type="module">
import { drawSprite, spriteIdForMember, CHAIRMAN_SPRITES } from '../js/ui/pixel/sprites.js';

const EXPRESSIONS = ['neutral', 'happy', 'angry'];
const ARCHETYPES = ['aggressive', 'cautious', 'operational'];
const scale = Math.max(1, Number(new URLSearchParams(location.search).get('scale')) || 3);
const grid = document.getElementById('grid');

function section(title, note) {
    const s = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = title;
    const small = document.createElement('small');
    small.textContent = note;
    h2.append(small);
    const row = document.createElement('div');
    row.className = 'row';
    s.append(h2, row);
    grid.append(s);
    return row;
}

function cell(row, id, expression, caption, s = scale) {
    const fig = document.createElement('figure');
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 32 * s;
    drawSprite(canvas.getContext('2d'), id, expression, 0, 0, s);
    const cap = document.createElement('figcaption');
    cap.textContent = caption;
    fig.append(canvas, cap);
    row.append(fig);
}

// Every chairman in every expression.
for (const [id, c] of Object.entries(CHAIRMAN_SPRITES)) {
    const row = section(id, `${c.label} · ${c.prop}`);
    for (const e of EXPRESSIONS) cell(row, id, e, e);
}

// Every archetype: each hair style x outfit (hair and skin cycle), neutral.
for (const a of ARCHETYPES) {
    const row = section(a, 'style x outfit, hair and skin cycling');
    for (let style = 0; style < 3; style++) {
        for (let outfit = 0; outfit < 4; outfit++) {
            const k = style * 4 + outfit;
            const id = `${a}.${k % 7}.${k % 6}.${outfit}.${style}`;
            cell(row, id, EXPRESSIONS[k % 3], `${id} ${EXPRESSIONS[k % 3]}`);
        }
    }
}

// The real boards from industries.json, as BoardScreen draws them.
const { industries } = await (await fetch('../data/industries.json')).json();
for (const industry of industries) {
    const row = section(industry.id, 'board members x 3 expressions');
    industry.boardMembers.forEach((m, i) => {
        const id = spriteIdForMember(m, i);
        for (const e of EXPRESSIONS) cell(row, id, e, `${m.name.split(' ').pop()} ${e}`);
    });
}

// Phone size: x2, as small as the sprites are drawn.
const phone = section('phone size', 'x2');
for (const id of Object.keys(CHAIRMAN_SPRITES)) for (const e of EXPRESSIONS) cell(phone, id, e, '', 2);
</script>
</body>
</html>
