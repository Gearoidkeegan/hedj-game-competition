<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene gallery</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
    /* Dev-only: every industry scene in every mood. Serve the repo root with
       `python -m http.server 8080` and open /tools/scene-gallery.html.
       Query params: ?t=<ms> freezes time; ?cash=<0..1>; ?hl=0 turns market highlights off;
       ?only=<industryId> shows one industry. */
    :root { --bg: #1a1a2e; --panel: #2d2d44; --edge: #5a5a7a; --text: #e8e8f0; --muted: #aaaacc; --gold: #ffcc00; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.3 'VT323', monospace; }
    header { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
    h1 { font: 14px/1.4 'Press Start 2P', monospace; margin: 0; color: var(--gold); }
    label { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); }
    main { padding: 0 16px 24px; display: grid; gap: 20px; }
    section h2 { font: 12px/1.4 'Press Start 2P', monospace; margin: 0 0 8px; }
    section h2 small { font: 16px 'VT323', monospace; color: var(--muted); margin-left: 8px; }
    .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    figure { margin: 0; background: var(--panel); border: 2px solid var(--edge); }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; }
    figcaption { padding: 2px 8px; font-size: 16px; color: var(--muted); }
    @media (max-width: 768px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
    <h1>Scene gallery</h1>
    <label>Cash <input id="cash" type="range" min="0" max="1" step="0.05" value="0.6"></label>
    <label><input id="hl" type="checkbox" checked> Market link on</label>
</header>
<main id="grid"></main>
<script type="module">
import { drawScene } from '../js/ui/pixel/Scene.js';

// Each industry with the underlying its scene reacts to.
const INDUSTRIES = [
    ['airline', 'Airport', 'JETNWE'],
    ['agrifoods', 'Agrifoods', 'COFFEE'],
    ['tech', 'Tech', 'COPPER'],
    ['pharma', 'Pharma', 'EURCHF'],
    ['construction', 'Construction', 'STEEL'],
    ['energy', 'Energy', 'BRENT'],
    ['retail', 'Retail', 'GBPUSD'],
];
const MOODS = ['calm', 'storm', 'boom'];
const params = new URLSearchParams(location.search);
const frozen = params.has('t') ? Number(params.get('t')) : null;
const cash = document.getElementById('cash');
const hl = document.getElementById('hl');
if (params.has('cash')) cash.value = params.get('cash');
if (params.get('hl') === '0') hl.checked = false;

const grid = document.getElementById('grid');
const cells = [];
const only = params.get('only');
for (const [id, name, link] of INDUSTRIES.filter(([i]) => !only || i === only)) {
    const section = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = name;
    const small = document.createElement('small');
    small.textContent = `${id} · reacts to ${link}`;
    h2.append(small);
    const row = document.createElement('div');
    row.className = 'row';
    for (const mood of MOODS) {
        const fig = document.createElement('figure');
        const canvas = document.createElement('canvas');
        const cap = document.createElement('figcaption');
        cap.textContent = mood;
        fig.append(canvas, cap);
        row.append(fig);
        cells.push({ canvas, ctx: canvas.getContext('2d'), id, mood, link });
    }
    section.append(h2, row);
    grid.append(section);
}

function fit(canvas) {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const W = Math.round(canvas.clientWidth * dpr), H = Math.round(canvas.clientHeight * dpr);
    if (W && H && (canvas.width !== W || canvas.height !== H)) { canvas.width = W; canvas.height = H; }
}

function frame(t) {
    const time = frozen ?? t;
    for (const c of cells) {
        fit(c.canvas);
        drawScene(c.ctx, c.id, { mood: c.mood, cashLevel: Number(cash.value), highlight: hl.checked ? c.link : null }, time);
    }
    if (frozen === null) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (frozen !== null) { cash.addEventListener('input', () => frame(0)); hl.addEventListener('change', () => frame(0)); }
</script>
</body>
</html>
