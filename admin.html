<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Treasury Manager Competition</title>
    <link rel="stylesheet" href="css/fonts.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-dark: #1a1a2e;
            --bg-panel: #2d2d44;
            --bg-panel-light: #3d3d5c;
            --bg-input: #1e1e35;
            --border-outer: #5a5a7a;
            --border-highlight: #8888aa;
            --gold: #ffcc00;
            --cyan: #44ccdd;
            --warning: #ff8844;
            --pnl-positive: #33cc66;
            --pnl-negative: #ff4444;
            --text-primary: #e8e8f0;
            --text-secondary: #aaaacc;
            --text-muted: #666688;
            --font-pixel: 'Press Start 2P', monospace;
            --font-mono: 'VT323', monospace;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 18px;
            min-height: 100vh;
            padding: 24px 16px;
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: 12px;
            color: var(--gold);
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        .tagline {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .panel {
            background: var(--bg-panel);
            border: 2px solid var(--border-outer);
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
            max-width: 960px;
            margin-left: auto;
            margin-right: auto;
        }

        .panel-title {
            font-family: var(--font-pixel);
            font-size: 8px;
            color: var(--cyan);
            letter-spacing: 1px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-outer);
            padding-bottom: 8px;
        }

        .key-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="password"] {
            background: var(--bg-input);
            border: 2px solid var(--border-outer);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 18px;
            padding: 8px 12px;
            flex: 1;
            min-width: 200px;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: var(--cyan);
        }

        button {
            background: var(--bg-panel-light);
            border: 2px solid var(--border-outer);
            color: var(--gold);
            font-family: var(--font-pixel);
            font-size: 8px;
            padding: 10px 16px;
            cursor: pointer;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        button:hover { border-color: var(--gold); }
        button:active { background: var(--bg-dark); }

        button.btn-cyan {
            color: var(--cyan);
            border-color: var(--cyan);
        }

        button.btn-cyan:hover { background: #1a3a40; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .stat-box {
            background: var(--bg-dark);
            border: 1px solid var(--border-outer);
            padding: 14px;
            text-align: center;
        }

        .stat-label {
            font-family: var(--font-pixel);
            font-size: 6px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-family: var(--font-pixel);
            font-size: 14px;
            color: var(--gold);
        }

        .stat-value.cyan { color: var(--cyan); }
        .stat-value.green { color: var(--pnl-positive); }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
        }

        thead th {
            font-family: var(--font-pixel);
            font-size: 7px;
            color: var(--cyan);
            letter-spacing: 1px;
            padding: 8px 10px;
            text-align: left;
            border-bottom: 2px solid var(--border-outer);
        }

        tbody tr { border-bottom: 1px solid var(--border-outer); }
        tbody tr:hover { background: var(--bg-panel-light); }

        tbody td {
            padding: 7px 10px;
            color: var(--text-primary);
            word-break: break-all;
        }

        tbody td.muted { color: var(--text-muted); font-size: 14px; }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .count-badge {
            font-family: var(--font-pixel);
            font-size: 7px;
            color: var(--text-muted);
            margin-left: auto;
        }

        .msg {
            font-family: var(--font-pixel);
            font-size: 7px;
            padding: 10px;
            text-align: center;
            letter-spacing: 1px;
        }

        .msg.error { color: var(--pnl-negative); }
        .msg.loading { color: var(--text-muted); }
        .msg.empty { color: var(--text-muted); }

        #auth-section { display: block; }
        #data-section { display: none; }
    </style>
</head>
<body>

<h1>TREASURY MANAGER</h1>
<div class="tagline">COMPETITION ADMIN</div>

<div id="auth-section" class="panel">
    <div class="panel-title">ADMIN ACCESS</div>
    <div class="key-input-row">
        <input type="password" id="admin-key-input" placeholder="Enter admin key..." autocomplete="off">
        <button id="btn-login">UNLOCK</button>
    </div>
    <div id="auth-msg" class="msg error" style="margin-top:10px;display:none;"></div>
</div>

<div id="data-section">

    <div class="panel">
        <div class="panel-title">OVERVIEW</div>
        <div id="event-status" class="msg" style="margin:0 0 10px;">–</div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">VISITS</div>
                <div class="stat-value cyan" id="stat-visits">–</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">PLAYS</div>
                <div class="stat-value cyan" id="stat-plays">–</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">REGISTRATIONS</div>
                <div class="stat-value green" id="stat-regs">–</div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">ENGAGEMENT</div>
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">PLAYERS WHO PLAYED</div><div class="stat-value cyan" id="m-unique">–</div></div>
            <div class="stat-box"><div class="stat-label">RUNS / PLAYER</div><div class="stat-value cyan" id="m-runs">–</div></div>
            <div class="stat-box"><div class="stat-label">RETURN RATE</div><div class="stat-value green" id="m-return">–</div></div>
            <div class="stat-box"><div class="stat-label">MULTI-DAY RATE</div><div class="stat-value green" id="m-multiday">–</div></div>
        </div>
        <div class="toolbar" style="margin-top:14px;">
            <button class="btn-cyan" data-prize-mode="simple" data-prize-period="event">PRIZE CSV: SIMPLE EVENT</button>
            <button class="btn-cyan" data-prize-mode="pro" data-prize-period="event">PRIZE CSV: PRO EVENT</button>
            <button data-prize-mode="simple" data-prize-period="today">SIMPLE TODAY</button>
            <button data-prize-mode="pro" data-prize-period="today">PRO TODAY</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">REGISTERED PLAYERS</div>
        <div class="toolbar">
            <button class="btn-cyan" id="btn-download-csv">DOWNLOAD CSV</button>
            <button id="btn-refresh">REFRESH</button>
            <span class="count-badge" id="player-count"></span>
        </div>
        <div id="players-msg" class="msg loading">LOADING...</div>
        <div id="players-table-wrap" style="overflow-x:auto;display:none;">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>NAME</th>
                        <th>EMAIL</th>
                        <th>COMPANY</th>
                        <th>REGISTERED AT</th>
                        <th>MARKETING</th>
                    </tr>
                </thead>
                <tbody id="players-tbody"></tbody>
            </table>
        </div>
    </div>

</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
