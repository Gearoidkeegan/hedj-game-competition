AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hedj Competition Backend — persistent leaderboard, registration, analytics

Parameters:
  AdminKey:
    Type: String
    NoEcho: true
    Description: Secret key for the admin analytics GET endpoint
  EventId:
    Type: String
    Default: test
    Description: Identifier of the live event; selects the leaderboard partition
  EventEndIso:
    Type: String
    Default: ''
    Description: ISO-8601 event end; player and score rows expire 90 days after it (empty = 90 days after each write). Scores are not rejected after it.
  TokenTtlHours:
    Type: Number
    Default: 120
    Description: Lifetime of a game token in hours

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 128
    Timeout: 10
    Environment:
      Variables:
        PLAYERS_TABLE: !Ref HCompPlayers
        SCORES_TABLE: !Ref HCompScores
        ANALYTICS_TABLE: !Ref HCompAnalytics
        BEST_TABLE: !Ref HCompBest
        EVENT_ID: !Ref EventId
        EVENT_END_ISO: !Ref EventEndIso
        TOKEN_TTL_HOURS: !Ref TokenTtlHours
        ADMIN_KEY: !Ref AdminKey

Resources:

  # ─── DynamoDB Tables ───────────────────────────────────────────────────────
  # Every table is Retain: a stack delete, a rollback to a template without it, or a replacement keeps the data.
  # The TableNames are fixed, so a retained orphan must be deleted or renamed before a stack can create it again
  # (docs/cutover.md, section J).

  HCompPlayers:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'HCompPlayers-${AWS::StackName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  HCompScores:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'HCompScores-${AWS::StackName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scoreId
          AttributeType: S
        - AttributeName: leaderboard
          AttributeType: S
        - AttributeName: score
          AttributeType: N
      KeySchema:
        - AttributeName: scoreId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GlobalLeaderboard
          KeySchema:
            - AttributeName: leaderboard
              KeyType: HASH
            - AttributeName: score
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  HCompBest:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'HCompBest-${AWS::StackName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: board
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: score
          AttributeType: N
      KeySchema:
        - AttributeName: board
          KeyType: HASH
        - AttributeName: email
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByScore
          KeySchema:
            - AttributeName: board
              KeyType: HASH
            - AttributeName: score
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  HCompAnalytics:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'HCompAnalytics-${AWS::StackName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: metricName
          AttributeType: S
      KeySchema:
        - AttributeName: metricName
          KeyType: HASH

  # ─── HTTP API ──────────────────────────────────────────────────────────────

  CompetitionApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      RouteSettings:
        'GET /admin/players':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        'GET /admin/metrics':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        'GET /admin/prize':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        'GET /analytics':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins:
          - 'https://competition.hedj.eu'
          - 'http://localhost:8080'
        AllowHeaders:
          - Content-Type
          - x-admin-key
          - x-player-email
          - x-game-token
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS

  # ─── Lambda Functions ─────────────────────────────────────────────────────

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: handlers/register.handler
      Description: Register a player for prize eligibility
      Events:
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /register
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HCompPlayers

  ScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: handlers/score.handler
      Description: Submit a game score to the persistent leaderboard
      Events:
        SubmitScore:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /score
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HCompPlayers
        - DynamoDBCrudPolicy:
            TableName: !Ref HCompScores
        - DynamoDBCrudPolicy:
            TableName: !Ref HCompBest

  LeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: handlers/leaderboard.handler
      Description: Retrieve the global leaderboard
      Events:
        GetLeaderboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /leaderboard
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HCompBest

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: handlers/analytics.handler
      Description: Track site visits and plays; admin read endpoint
      Events:
        TrackEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /analytics
            Method: POST
        GetAnalytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /analytics
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HCompAnalytics

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: handlers/admin.handler
      Description: Admin endpoints — list players, engagement metrics, prize export
      Events:
        GetPlayers:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /admin/players
            Method: GET
        GetMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /admin/metrics
            Method: GET
        GetPrize:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /admin/prize
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HCompPlayers
        - DynamoDBReadPolicy:
            TableName: !Ref HCompBest

  ProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: handlers/progress.handler
      Description: Read and merge a player's cross-device progress
      Events:
        GetProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /progress
            Method: GET
        PutProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref CompetitionApi
            Path: /progress
            Method: PUT
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HCompPlayers

Outputs:
  ApiUrl:
    Description: API Gateway invoke URL — add as /api/* origin in CloudFront
    Value: !Sub 'https://${CompetitionApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  PlayersTable:
    Value: !Ref HCompPlayers
  ScoresTable:
    Value: !Ref HCompScores
  BestTable:
    Value: !Ref HCompBest
  AnalyticsTable:
    Value: !Ref HCompAnalytics
