name: Deploy Competition (backend, then frontend)

# One workflow so the frontend never goes live before the API it needs (R56).
# Every push to main deploys the backend first, then the frontend (R58). Nothing is diffed: a queued run that a
# newer push replaces would otherwise lose its backend change. An unchanged backend is a cheap no-op
# (--no-fail-on-empty-changeset) and the frontend sync is idempotent.
# The frontend is skipped if the backend deploy fails or is cancelled.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options:
          - both
          - backend
          - frontend
        default: both
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'index.html'
      - 'admin.html'
      - 'privacy.html'
      - 'stand.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'assets/**'

permissions:
  id-token: write
  contents: read

# Two deploys never overlap; a second push waits for the first to finish.
concurrency:
  group: deploy-comp
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (SAM build + deploy)
    # Every push; a manual run unless it picked "frontend".
    if: github.event_name == 'push' || inputs.target != 'frontend'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_COMP }}
          aws-region: eu-north-1
          role-session-name: GitHubActions-SAMDeploy-${{ github.run_id }}

      - name: SAM build
        working-directory: backend
        run: sam build --template template.yaml

      # Event settings come from repository variables (Settings → Secrets and variables → Actions → Variables).
      # Every parameter is always passed: SAM reuses the previous value of any parameter left out on an update,
      # so omitting one would silently keep an old event live.
      - name: SAM deploy
        working-directory: backend
        env:
          EVENT_NAME: ${{ github.event_name }}
          ADMIN_KEY: ${{ secrets.COMP_ADMIN_KEY }}
          EVENT_ID: ${{ vars.COMP_EVENT_ID }}
          EVENT_START_ISO: ${{ vars.COMP_EVENT_START_ISO }}
          EVENT_END_ISO: ${{ vars.COMP_EVENT_END_ISO }}
          TOKEN_TTL_HOURS: ${{ vars.COMP_TOKEN_TTL_HOURS || '120' }}
        run: |
          # An unset COMP_EVENT_ID is free play (R66): EventId="" goes to the backend, which then opens no
          # registration and takes no scores. Deleting the variable during an event closes the competition.
          # The event id is part of every leaderboard key ("<event>#<mode>#<day>"), so keep it plain.
          if [ -n "$EVENT_ID" ] && [[ ! "$EVENT_ID" =~ ^[A-Za-z0-9_-]{1,40}$ ]]; then
            echo "::error::COMP_EVENT_ID must be 1-40 letters, digits, '_' or '-' (got '$EVENT_ID')"; exit 1
          fi
          if [[ ! "$TOKEN_TTL_HOURS" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::COMP_TOKEN_TTL_HOURS must be a whole number of hours (got '$TOKEN_TTL_HOURS')"; exit 1
          fi
          # Strict ISO-8601 UTC only. `date -d` alone accepts "tomorrow" or a value with a space, which SAM would
          # split or the backend would read as "no date". The date check then rejects impossible dates.
          for var in EVENT_START_ISO EVENT_END_ISO; do
            value="${!var}"
            if [ -n "$value" ]; then
              if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?Z$ ]] \
                 || ! date -u -d "$value" >/dev/null 2>&1; then
                echo "::error::COMP_$var must look like 2026-11-20T18:00:00Z or 2026-11-20T18:00Z, in UTC (got '$value')"; exit 1
              fi
            fi
          done
          if [ -n "$EVENT_START_ISO" ] && [ -n "$EVENT_END_ISO" ] \
             && [ "$(date -u -d "$EVENT_START_ISO" +%s)" -ge "$(date -u -d "$EVENT_END_ISO" +%s)" ]; then
            echo "::error::COMP_EVENT_START_ISO must be before COMP_EVENT_END_ISO (got '$EVENT_START_ISO' and '$EVENT_END_ISO')"; exit 1
          fi
          # Each override is passed as Key="value", so SAM keeps spaces, commas and '=' inside the value. A double
          # quote or a backslash can't be carried that way, so the admin key must not contain either.
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::COMP_ADMIN_KEY is not set"; exit 1
          fi
          case "$ADMIN_KEY" in
            *'"'* | *'\'*) echo "::error::COMP_ADMIN_KEY must not contain a double quote or a backslash"; exit 1 ;;
          esac
          # An empty id or date goes as Key="" so it clears any earlier value. The backend treats an empty date as
          # "no date" (and then keeps rows 90 days after each write).
          echo "Deploying EventId=${EVENT_ID:-(free play)} EventStartIso=${EVENT_START_ISO:-<empty>} EventEndIso=${EVENT_END_ISO:-<empty>} TokenTtlHours=$TOKEN_TTL_HOURS"
          echo "DEPLOYED_EVENT_ID=${EVENT_ID:-(free play)}" >> "${GITHUB_ENV:-/dev/null}"
          sam deploy \
            --stack-name hedj-competition-backend \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region eu-north-1 \
            --parameter-overrides \
              "AdminKey=\"$ADMIN_KEY\"" \
              "EventId=\"$EVENT_ID\"" \
              "EventStartIso=\"$EVENT_START_ISO\"" \
              "EventEndIso=\"$EVENT_END_ISO\"" \
              "TokenTtlHours=\"$TOKEN_TTL_HOURS\""

      - name: Print API URL
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name hedj-competition-backend \
            --region eu-north-1 \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "## Backend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${DEPLOYED_EVENT_ID}" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "Add this as the /api/* origin in CloudFront." >> $GITHUB_STEP_SUMMARY
          echo "API_URL=${API_URL}" >> $GITHUB_STEP_SUMMARY

  frontend:
    name: Frontend (S3 + CloudFront)
    needs: backend
    # Every push; a manual run unless it picked "backend". always() lets this job run when a manual run skipped
    # the backend job; it still never runs after a failed or cancelled backend deploy.
    if: >-
      always()
      && (github.event_name == 'push' || inputs.target != 'backend')
      && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_COMP }}
          aws-region: eu-north-1
          role-session-name: GitHubActions-DeployComp-${{ github.run_id }}

      - name: Sync game files to S3
        run: |
          aws s3 sync . "s3://hedj-comp-assets-eu-north-1/" \
            --region eu-north-1 \
            --cache-control "public, max-age=300" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "backend/*" \
            --exclude "tools/*" \
            --exclude "*.md" \
            --exclude ".gitignore" \
            --exclude ".claude/*" \
            --exclude "tests/*" \
            --exclude "docs/*" \
            --exclude "node_modules/*" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude ".superpowers/*" \
            --exclude "Open Game.url" \
            --exclude "Individual industry sample images.png" \
            --exclude "assets/fonts/*.woff2" \
            --delete

          # Correct MIME types
          for ext in js css json; do
            case $ext in
              js) ct="application/javascript" ;;
              css) ct="text/css" ;;
              json) ct="application/json" ;;
            esac
            aws s3 cp "s3://hedj-comp-assets-eu-north-1/" \
              "s3://hedj-comp-assets-eu-north-1/" \
              --recursive \
              --exclude "*" \
              --include "*.${ext}" \
              --content-type "${ct}" \
              --metadata-directive REPLACE \
              --cache-control "public, max-age=300" \
              --region eu-north-1
          done

      # Fonts get their own sync: an explicit font/woff2 type (not the CLI's mimetypes guess) and a one-year
      # immutable cache. The file names are not content-hashed, so a changed font must get a new file name.
      # Files excluded from a sync are also protected from its --delete, which is why the main sync leaves
      # *.woff2 alone and this step deletes stale fonts itself.
      - name: Sync fonts
        run: |
          aws s3 sync assets/fonts "s3://hedj-comp-assets-eu-north-1/assets/fonts/" \
            --region eu-north-1 \
            --exclude "*" \
            --include "*.woff2" \
            --content-type "font/woff2" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Invalidate CloudFront
        env:
          CF_ID: ${{ secrets.CF_COMP_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CF_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CF_ID" \
              --paths "/*" \
              --region us-east-1
            echo "CloudFront invalidation created"
          else
            echo "CF_COMP_DISTRIBUTION_ID not set — skipping CloudFront invalidation"
          fi

      - name: Summary
        run: |
          echo "## Deployed Competition Frontend" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://competition.hedj.eu" >> $GITHUB_STEP_SUMMARY
