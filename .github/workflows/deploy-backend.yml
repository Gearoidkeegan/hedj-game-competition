name: Deploy Competition Backend (SAM)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: SAM Build + Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_COMP }}
          aws-region: eu-north-1
          role-session-name: GitHubActions-SAMDeploy-${{ github.run_id }}

      - name: SAM build
        working-directory: backend
        run: sam build --template template.yaml

      # Event settings come from repository variables (Settings → Secrets and variables → Actions → Variables).
      # Every parameter is always passed: SAM reuses the previous value of any parameter left out on an update,
      # so omitting one would silently keep an old event live.
      - name: SAM deploy
        working-directory: backend
        env:
          ADMIN_KEY: ${{ secrets.COMP_ADMIN_KEY }}
          EVENT_ID: ${{ vars.COMP_EVENT_ID || 'test' }}
          EVENT_END_ISO: ${{ vars.COMP_EVENT_END_ISO }}
          TOKEN_TTL_HOURS: ${{ vars.COMP_TOKEN_TTL_HOURS || '120' }}
        run: |
          # The event id is part of every leaderboard key ("<event>#<mode>#<day>"), so keep it plain.
          if ! printf '%s' "$EVENT_ID" | grep -Eq '^[A-Za-z0-9_-]{1,40}$'; then
            echo "::error::COMP_EVENT_ID must be 1-40 letters, digits, '_' or '-' (got '$EVENT_ID')"; exit 1
          fi
          if ! printf '%s' "$TOKEN_TTL_HOURS" | grep -Eq '^[1-9][0-9]{0,3}$'; then
            echo "::error::COMP_TOKEN_TTL_HOURS must be a whole number of hours (got '$TOKEN_TTL_HOURS')"; exit 1
          fi
          if [ -n "$EVENT_END_ISO" ] && ! date -u -d "$EVENT_END_ISO" >/dev/null 2>&1; then
            echo "::error::COMP_EVENT_END_ISO must be an ISO-8601 date, e.g. 2026-11-20T18:00:00Z (got '$EVENT_END_ISO')"; exit 1
          fi
          # An empty end date is passed as "" so it clears any earlier value. The backend treats an empty or
          # unparseable value as "no end date" and keeps rows 90 days after each write.
          END_ARG="${EVENT_END_ISO:-\"\"}"
          echo "Deploying EventId=$EVENT_ID EventEndIso=${EVENT_END_ISO:-<empty>} TokenTtlHours=$TOKEN_TTL_HOURS"
          sam deploy \
            --stack-name hedj-competition-backend \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region eu-north-1 \
            --parameter-overrides \
              "AdminKey=$ADMIN_KEY" \
              "EventId=$EVENT_ID" \
              "EventEndIso=$END_ARG" \
              "TokenTtlHours=$TOKEN_TTL_HOURS"

      - name: Print API URL
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name hedj-competition-backend \
            --region eu-north-1 \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "## Backend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "Add this as the /api/* origin in CloudFront." >> $GITHUB_STEP_SUMMARY
          echo "API_URL=${API_URL}" >> $GITHUB_STEP_SUMMARY
