<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — Treasury Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a1a2e; --panel: #2d2d44; --border: #5a5a7a;
            --gold: #ffcc00; --cyan: #44ccdd; --text: #e8e8f0; --muted: #aaaacc;
            --pixel: 'Press Start 2P', monospace; --mono: 'VT323', monospace;
        }
        body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 32px; min-height: 100vh; padding: 24px 32px; }
        h1 { font-family: var(--pixel); font-size: 36px; color: var(--gold); text-align: center; letter-spacing: 4px; margin-bottom: 8px; }
        .sub { text-align: center; color: var(--muted); font-size: 28px; margin-bottom: 24px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .board { background: var(--panel); border: 4px solid var(--border); padding: 16px 24px; }
        .board h2 { font-family: var(--pixel); font-size: 20px; color: var(--cyan); margin-bottom: 16px; line-height: 1.4; }
        ol { list-style: none; }
        li { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 12px; align-items: baseline; padding: 4px 0; border-bottom: 2px solid #3d3d5c; }
        li:first-child .rank, li:first-child .score { color: var(--gold); }
        .rank { color: var(--muted); }
        .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .co { color: var(--muted); font-size: 0.8em; }
        .score { font-variant-numeric: tabular-nums; }
        li.empty { display: block; color: var(--muted); padding: 12px 0; }
        @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } body { font-size: 24px; } h1 { font-size: 22px; } }
    </style>
</head>
<body>
<h1>TREASURY MANAGER</h1>
<div class="sub" id="updated">Loading...</div>
<div class="grid">
    <section class="board"><h2>SIMPLE - EVENT TOP 10</h2><ol id="b-simple-event"></ol></section>
    <section class="board"><h2>PRO - EVENT TOP 10</h2><ol id="b-pro-event"></ol></section>
</div>
<div class="grid">
    <section class="board"><h2>SIMPLE - TODAY</h2><ol id="b-simple-today"></ol></section>
    <section class="board"><h2>PRO - TODAY</h2><ol id="b-pro-today"></ol></section>
</div>
<script type="module" src="js/stand.js"></script>
</body>
</html>
